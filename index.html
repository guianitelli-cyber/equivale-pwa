<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Equivale</title>
<meta name="theme-color" content="#15150F">
<meta name="description" content="Calculadora de equivalência nutricional entre alimentos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Equivale">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

  :root{
    --bg: #15150F;
    --panel: #1D1D14;
    --panel-2: #23231A;
    --line: #EDE8D8;
    --line-dim: #38382C;
    --text: #EDE8D8;
    --text-dim: #A9A594;
    --rust: #C1432A;
    --olive: #7C8B4A;
    --gold: #E3B23C;
    --blue: #5C8AA8;
    --mono: 'IBM Plex Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#0A0A07;
    font-family:var(--body);
    color:var(--text);
    display:flex;
    justify-content:center;
  }

  .phone{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  .appbar{
    padding:1.1rem 1.15rem 0.9rem;
    display:flex;
    align-items:center;
    gap:0.7rem;
    border-bottom:1px solid var(--line-dim);
    flex-shrink:0;
  }
  .back-btn{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--line-dim);
    display:flex; align-items:center; justify-content:center;
    color:var(--text);
    font-size:1.1rem;
    cursor:pointer;
    flex-shrink:0;
    visibility:hidden;
  }
  .back-btn.show{visibility:visible;}
  .logo-mark{
    width:34px; height:34px;
    border-radius:9px;
    flex-shrink:0;
  }
  .appbar-title{
    font-family:var(--display);
    font-weight:700;
    font-size:1.15rem;
  }
  .appbar-title .accent{color:var(--rust);}
  .appbar-sub{
    font-family:var(--mono);
    font-size:0.68rem;
    color:var(--text-dim);
    margin-top:0.1rem;
  }
  #installBtn{
    display:none; margin-left:auto;
    font-family:var(--mono); font-size:0.68rem;
    background:var(--gold); color:#15150F;
    border:none; border-radius:100px;
    padding:0.4rem 0.7rem; font-weight:700; cursor:pointer;
  }

  .screens{flex:1; position:relative; overflow:hidden;}
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transform:translateX(16px);
    transition:opacity .18s ease, transform .18s ease;
  }
  .screen.active{opacity:1; pointer-events:auto; transform:translateX(0);}
  .scroll{flex:1; overflow-y:auto; padding:1rem 1.15rem 1rem;}

  /* Screen 0: categoria */
  .cat-intro{padding:1.5rem 0 1rem; text-align:center;}
  .cat-intro h2{font-family:var(--display); font-weight:700; font-size:1.3rem; margin-bottom:0.4rem;}
  .cat-intro p{color:var(--text-dim); font-size:0.85rem; max-width:30ch; margin:0 auto;}
  .cat-grid{display:flex; flex-direction:column; gap:0.7rem;}
  .cat-card{
    background:var(--panel);
    border:1px solid var(--line-dim);
    border-radius:12px;
    padding:1.1rem 1.2rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:0.9rem;
    transition:border-color .12s ease;
  }
  .cat-card:active{border-color:var(--text-dim);}
  .cat-icon{
    width:44px; height:44px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.3rem;
    flex-shrink:0;
  }
  .cat-icon.proteinas{background:#2A1712; color:var(--rust);}
  .cat-icon.carboidratos{background:#2A2412; color:var(--gold);}
  .cat-icon.frutas{background:#241B2A; color:#B07CC6;}
  .cat-icon.laticinios{background:#242018; color:#E8D9A8;}
  .cat-icon.nozes{background:#231A10; color:#C88A4A;}
  .cat-icon.gordura{background:#1E2312; color:#9CB05C;}
  .cat-info .cname{font-family:var(--display); font-weight:700; font-size:1.02rem;}
  .cat-info .cdesc{font-family:var(--mono); font-size:0.68rem; color:var(--text-dim); margin-top:0.2rem;}

  /* Screen 1: search + list */
  .search-box{
    background:var(--panel);
    border:1px solid var(--line-dim);
    border-radius:10px;
    padding:0.7rem 0.85rem;
    margin-bottom:0.9rem;
    display:flex;
    align-items:center;
    gap:0.5rem;
  }
  .search-box input{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-family:var(--body); font-size:0.95rem;
  }
  .search-box input::placeholder{color:var(--text-dim);}
  .search-box svg{flex-shrink:0; opacity:0.5;}

  .results-search{
    background:var(--panel);
    border:1px solid var(--line-dim);
    border-radius:10px;
    padding:0.65rem 0.85rem;
    margin:0.8rem 1.15rem 0;
    display:flex;
    align-items:center;
    gap:0.5rem;
  }
  .results-search input{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-family:var(--body); font-size:0.92rem;
  }
  .results-search input::placeholder{color:var(--text-dim);}
  .results-search svg{flex-shrink:0; opacity:0.5; color:var(--text-dim);}

  .group-chip-row{
    display:flex; gap:0.4rem;
    overflow-x:auto;
    padding-bottom:0.2rem;
    padding-right:1.5rem;
    margin-bottom:1rem;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x;
    position:relative;
    mask-image:linear-gradient(to right, black 92%, transparent 100%);
    -webkit-mask-image:linear-gradient(to right, black 92%, transparent 100%);
  }
  .group-chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    font-family:var(--mono);
    font-size:0.72rem;
    padding:0.42rem 0.8rem;
    border-radius:100px;
    border:1px solid var(--line-dim);
    color:var(--text-dim);
    white-space:nowrap;
    cursor:pointer;
    touch-action:manipulation;
  }
  .chip.active{background:var(--gold); color:#15150F; border-color:var(--gold); font-weight:600;}

  .food-list{display:flex; flex-direction:column; gap:0.5rem;}
  .food-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--line-dim);
    border-radius:10px;
    padding:0.9rem 1rem;
    cursor:pointer;
  }
  .food-row:active{background:var(--panel-2);}
  .food-row .fname{font-size:0.95rem; font-weight:500;}
  .food-row .fgroup{font-family:var(--mono); font-size:0.66rem; color:var(--olive); text-transform:uppercase; margin-top:0.2rem;}
  .food-row .fval{font-family:var(--mono); font-size:0.85rem; color:var(--gold); font-weight:600; flex-shrink:0; margin-left:0.6rem;}

  /* Screen 2: quantity */
  .qty-hero{text-align:center; padding:2rem 1rem 1.5rem;}
  .qty-hero .selname{font-family:var(--display); font-weight:700; font-size:1.4rem; margin-bottom:0.3rem;}
  .qty-hero .selgroup{font-family:var(--mono); font-size:0.72rem; color:var(--olive); text-transform:uppercase; letter-spacing:0.05em;}

  .big-stepper{display:flex; align-items:center; justify-content:center; gap:1.4rem; margin:1.5rem 0;}
  .big-stepper button{
    width:56px; height:56px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line-dim);
    color:var(--text); font-size:1.6rem; cursor:pointer;
  }
  .big-stepper button:active{background:var(--panel-2);}
  .big-stepper .qty-display{
    font-family:var(--mono); font-weight:700; font-size:2.6rem;
    color:var(--gold); min-width:130px; text-align:center;
  }
  .big-stepper .qty-display .u{font-size:1.1rem; color:var(--text-dim); margin-left:0.3rem;}

  .quick-amounts{display:flex; justify-content:center; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap; padding:0 1rem;}
  .quick-amounts button{
    font-family:var(--mono); font-size:0.78rem; padding:0.4rem 0.75rem;
    border-radius:8px; background:var(--panel-2); border:1px solid var(--line-dim);
    color:var(--text-dim); cursor:pointer;
  }

  .protein-preview{
    margin:1rem 1.15rem 0;
    background:linear-gradient(135deg, #241611, #1D1D14);
    border:1px solid var(--rust);
    border-radius:10px;
    padding:0.9rem 1.1rem;
    text-align:center;
  }
  .protein-preview .n{font-family:var(--mono); font-weight:700; font-size:1.5rem; color:var(--rust);}
  .protein-preview .t{font-family:var(--mono); font-size:0.68rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:0.15rem;}

  /* Screen 3: results */
  .result-summary{padding:0.9rem 1.15rem; border-bottom:1px solid var(--line-dim);}
  .result-summary .line1{font-size:0.88rem; color:var(--text-dim);}
  .result-summary .line1 b{color:var(--text); font-weight:600;}
  .result-summary .line2{font-family:var(--mono); font-size:0.72rem; color:var(--rust); margin-top:0.35rem;}
  .result-summary .line3{font-family:var(--mono); font-size:0.7rem; color:var(--text-dim); margin-top:0.25rem;}

  .filter-toggle{
    display:flex; align-items:center; justify-content:space-between;
    padding:0.75rem 1.15rem;
    border-bottom:1px solid var(--line-dim);
  }
  .filter-toggle span{font-family:var(--mono); font-size:0.72rem; color:var(--text-dim);}
  .sort-row{
    display:flex; align-items:center; gap:0.5rem;
    padding:0.7rem 1.15rem;
    border-bottom:1px solid var(--line-dim);
  }
  .sort-label{font-family:var(--mono); font-size:0.68rem; color:var(--text-dim); margin-right:0.2rem;}
  .sort-btn{
    font-family:var(--mono); font-size:0.72rem;
    padding:0.35rem 0.7rem;
    border-radius:100px;
    border:1px solid var(--line-dim);
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
  }
  .sort-btn.active{background:var(--gold); color:#15150F; border-color:var(--gold); font-weight:600;}
  .toggle{
    width:38px; height:22px;
    background:var(--panel-2); border:1px solid var(--line-dim);
    border-radius:100px; cursor:pointer; position:relative; flex-shrink:0;
  }
  .toggle .dot{
    width:16px; height:16px; background:var(--text-dim);
    border-radius:50%; position:absolute; top:2px; left:2px;
    transition:all .15s ease;
  }
  .toggle.on{background:#3A3520; border-color:var(--gold);}
  .toggle.on .dot{background:var(--gold); left:19px;}

  .sub-list{display:flex; flex-direction:column; gap:0.6rem; padding:1rem 1.15rem;}
  .sub-card{
    background:var(--panel); border:2px solid var(--line); border-radius:8px;
    padding:0.85rem 1rem; display:flex; align-items:center; justify-content:space-between; gap:0.8rem;
  }
  .sub-card .left .sname{font-family:var(--display); font-weight:700; font-size:0.98rem;}
  .sub-card .left .sfacts{font-family:var(--mono); font-size:0.68rem; color:var(--text-dim); margin-top:0.3rem;}
  .sub-card .right{text-align:right; flex-shrink:0;}
  .sub-card .right .amt{font-family:var(--mono); font-weight:700; font-size:1.5rem; color:var(--gold); line-height:1;}
  .sub-card .right .u{font-family:var(--mono); font-size:0.72rem; color:var(--text-dim);}

  .action-bar{
    padding:0.9rem 1.15rem calc(0.9rem + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--line-dim);
    flex-shrink:0;
  }
  .btn-primary{
    width:100%; padding:0.9rem;
    background:var(--rust); color:#F7F1E5;
    border:none; border-radius:10px;
    font-family:var(--display); font-weight:700; font-size:1rem; cursor:pointer;
  }
  .btn-primary:active{background:#A6371F;}

  .empty{text-align:center; color:var(--text-dim); font-size:0.85rem; padding:2rem 1rem;}

  @media (max-width:520px){
    .cat-intro h2{font-size:1.15rem;}
  }
</style>
</head>
<body>
<div class="phone">

  <div class="appbar">
    <div class="back-btn" id="backBtn">←</div>
    <img src="icon-192.png" alt="" class="logo-mark">
    <div>
      <div class="appbar-title">Equi<span class="accent">vale</span></div>
      <div class="appbar-sub" id="appbarSub">passo 1 de 4 · categoria</div>
    </div>
    <button id="installBtn">Instalar</button>
  </div>

  <div class="screens">

    <!-- SCREEN 0: categoria -->
    <div class="screen active" id="screen-categoria">
      <div class="scroll">
        <div class="cat-intro">
          <h2>O que você quer substituir?</h2>
          <p>Escolha a categoria pra calcular a equivalência certa</p>
        </div>
        <div class="cat-grid" id="catGrid"></div>
      </div>
    </div>

    <!-- SCREEN 1: pick food -->
    <div class="screen" id="screen-search">
      <div class="scroll">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search" placeholder="Buscar alimento...">
        </div>
        <div class="group-chip-row" id="chips"></div>
        <div class="food-list" id="foodList"></div>
      </div>
    </div>

    <!-- SCREEN 2: quantity -->
    <div class="screen" id="screen-qty">
      <div class="scroll" style="padding-top:0;">
        <div class="qty-hero">
          <div class="selname" id="selName">—</div>
          <div class="selgroup" id="selGroup">—</div>
        </div>
        <div class="big-stepper">
          <button id="qMinus">−</button>
          <div class="qty-display"><span id="qVal">150</span><span class="u">g</span></div>
          <button id="qPlus">+</button>
        </div>
        <div class="quick-amounts" id="quickAmounts"></div>
        <p style="text-align:center; font-family:var(--mono); font-size:0.68rem; color:var(--text-dim); margin-top:-0.4rem;">toque quantas vezes precisar pra somar</p>
      </div>
      <div class="protein-preview" style="margin-bottom:1rem;">
        <div class="n" id="proteinPreview">—</div>
        <div class="t" id="proteinPreviewLabel">nessa quantidade</div>
      </div>
      <div class="action-bar">
        <button class="btn-primary" id="toResults">Ver substitutos</button>
      </div>
    </div>

    <!-- SCREEN 3: results -->
    <div class="screen" id="screen-results">
      <div class="result-summary">
        <div class="line1"><b id="rSumFood">—</b> <span id="rSumQty">—</span></div>
        <div class="line2" id="rSumProtein">—</div>
        <div class="line3" id="rSumKcal">—</div>
      </div>
      <div class="filter-toggle" id="filterToggleRow">
        <span id="toggleLabel">Apenas mesmo subgrupo</span>
        <div class="toggle" id="groupToggle"><div class="dot"></div></div>
      </div>
      <div class="results-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="resultsSearch" placeholder="Buscar nos substitutos...">
      </div>
      <div class="sort-row">
        <span class="sort-label">Ordenar</span>
        <button class="sort-btn active" id="sortByQty" data-sort="qty">Quantidade</button>
        <button class="sort-btn" id="sortByName" data-sort="name">Nome A-Z</button>
      </div>
      <div class="scroll" style="padding-top:0;">
        <div class="sub-list" id="subList"></div>
      </div>
      <div class="action-bar">
        <button class="btn-primary" id="newSearch">Nova busca</button>
      </div>
    </div>

  </div>
</div>

<script>
// ---------- DATA ----------
const CATEGORIES = {

// ---------- STATE ----------
let state = {
  screen: 'categoria',
  category: null,
  activeChip: 'todos',
  searchTerm: '',
  selectedId: null,
  qty: 100,
  sameGroupOnly: false,
  sortBy: 'qty',
  resultsSearchTerm: ''
};

// ---------- HELPERS ----------
function catInfo(){ return CATEGORIES[state.category]; }
function getSelected(){ return FOODS.find(f => f.id === state.selectedId); }
function nutrientOf(food){ return food[catInfo().nutrient]; }
function targetValue(){ const f = getSelected(); return f ? (nutrientOf(f)/100) * state.qty : 0; }
function foodsInCategory(){ return FOODS.filter(f => f.category === state.category); }
function subgroupsInCategory(){
  const set = new Set(foodsInCategory().map(f => f.subgroup).filter(Boolean));
  return [...set];
}

// ---------- NAVIGATION ----------
function goScreen(name){
  state.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  const back = document.getElementById('backBtn');
  const sub = document.getElementById('appbarSub');
  if(name === 'categoria'){ back.classList.remove('show'); sub.textContent = 'passo 1 de 4 · categoria'; }
  if(name === 'search'){ back.classList.add('show'); sub.textContent = 'passo 2 de 4 · alimento'; }
  if(name === 'qty'){ back.classList.add('show'); sub.textContent = 'passo 3 de 4 · quantidade'; }
  if(name === 'results'){ back.classList.add('show'); sub.textContent = 'passo 4 de 4 · substitutos'; }
}

document.getElementById('backBtn').onclick = () => {
  if(state.screen === 'search') goScreen('categoria');
  else if(state.screen === 'qty') goScreen('search');
  else if(state.screen === 'results') goScreen('qty');
};

// ---------- SCREEN 0: categoria ----------
function renderCategories(){
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, c]) => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `
      <div class="cat-icon ${key}">${c.icon}</div>
      <div class="cat-info">
        <div class="cname">${c.label}</div>
        <div class="cdesc">${c.desc}</div>
      </div>
    `;
    card.onclick = () => {
      state.category = key;
      state.activeChip = 'todos';
      state.searchTerm = '';
      state.selectedId = null;
      state.qty = c.defaultQty;
      document.getElementById('search').value = '';
      renderChips();
      renderFoodList();
      goScreen('search');
    };
    grid.appendChild(card);
  });
}

// ---------- SCREEN 1: search + list ----------
function renderChips(){
  const chips = document.getElementById('chips');
  const subs = subgroupsInCategory();
  if(subs.length <= 1){
    chips.style.display = 'none';
    return;
  }
  chips.style.display = 'flex';
  chips.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (state.activeChip === 'todos' ? ' active' : '');
  allChip.textContent = 'Todos';
  allChip.onclick = () => { state.activeChip = 'todos'; renderChips(); renderFoodList(); };
  chips.appendChild(allChip);
  subs.forEach(sg => {
    const c = document.createElement('div');
    c.className = 'chip' + (state.activeChip === sg ? ' active' : '');
    c.textContent = SUBGROUPS[sg] || sg;
    c.onclick = () => { state.activeChip = sg; renderChips(); renderFoodList(); };
    chips.appendChild(c);
  });
}

function matchesSearch(food, term){
  if(!term) return true;
  if(food.name.toLowerCase().includes(term)) return true;
  const subLabel = food.subgroup ? (SUBGROUPS[food.subgroup] || '') : '';
  if(subLabel.toLowerCase().includes(term)) return true;
  const catLabel = CATEGORIES[food.category] ? CATEGORIES[food.category].label : '';
  if(catLabel.toLowerCase().includes(term)) return true;
  return false;
}

function renderFoodList(){
  const list = document.getElementById('foodList');
  list.innerHTML = '';
  const term = state.searchTerm.toLowerCase();
  const info = catInfo();
  const items = foodsInCategory().filter(f => {
    const mChip = state.activeChip === 'todos' || f.subgroup === state.activeChip;
    const mSearch = matchesSearch(f, term);
    return mChip && mSearch;
  });
  if(items.length === 0){
    list.innerHTML = '<div class="empty">Nenhum alimento encontrado</div>';
    return;
  }
  items.forEach(f => {
    const row = document.createElement('div');
    row.className = 'food-row';
    const groupLabel = f.subgroup ? (SUBGROUPS[f.subgroup] || f.subgroup) : info.label;
    row.innerHTML = `
      <div>
        <div class="fname">${f.name}</div>
        <div class="fgroup">${groupLabel}</div>
      </div>
      <div class="fval">${nutrientOf(f)}${info.unit === 'g' ? 'g' : ' kcal'}</div>
    `;
    row.onclick = () => {
      state.selectedId = f.id;
      state.qty = 0;
      document.getElementById('selName').textContent = f.name;
      document.getElementById('selGroup').textContent = groupLabel;
      renderQuickAmounts();
      updateQtyPreview();
      goScreen('qty');
    };
    list.appendChild(row);
  });
}

document.getElementById('search').addEventListener('input', e => {
  state.searchTerm = e.target.value;
  renderFoodList();
});

// ---------- SCREEN 2: quantity ----------
function renderQuickAmounts(){
  const wrap = document.getElementById('quickAmounts');
  const base = catInfo().defaultQty;
  const opts = catInfo().unit === 'kcal'
    ? [50, 100, 150, 200, 300]
    : [Math.round(base*0.33/10)*10, Math.round(base*0.66/10)*10, base, Math.round(base*1.33/10)*10, Math.round(base*2/10)*10];
  wrap.innerHTML = '';
  opts.forEach(v => {
    const b = document.createElement('button');
    b.textContent = '+' + v + 'g';
    b.onclick = () => addQty(v);
    wrap.appendChild(b);
  });
  const clearBtn = document.createElement('button');
  clearBtn.textContent = 'limpar';
  clearBtn.style.color = 'var(--rust)';
  clearBtn.style.borderColor = 'var(--rust)';
  clearBtn.onclick = () => setQty(0);
  wrap.appendChild(clearBtn);
}

function updateQtyPreview(){
  document.getElementById('qVal').textContent = state.qty;
  document.getElementById('proteinPreview').textContent = targetValue().toFixed(1) + (catInfo().unit === 'g' ? 'g' : ' kcal');
  document.getElementById('proteinPreviewLabel').textContent = `de ${catInfo().verb} nessa quantidade`;
}

function setQty(v){
  state.qty = Math.max(0, v);
  updateQtyPreview();
}

function addQty(v){
  state.qty = Math.max(0, state.qty + v);
  updateQtyPreview();
}

document.getElementById('qMinus').onclick = () => setQty(state.qty - 10);
document.getElementById('qPlus').onclick = () => setQty(state.qty + 10);

document.getElementById('toResults').onclick = () => {
  state.resultsSearchTerm = '';
  document.getElementById('resultsSearch').value = '';
  renderResults();
  goScreen('results');
};

document.getElementById('newSearch').onclick = () => goScreen('categoria');

document.getElementById('resultsSearch').addEventListener('input', (e) => {
  state.resultsSearchTerm = e.target.value;
  renderResults();
});

// ---------- SCREEN 3: results ----------
const groupToggle = document.getElementById('groupToggle');
groupToggle.onclick = () => {
  state.sameGroupOnly = !state.sameGroupOnly;
  groupToggle.classList.toggle('on', state.sameGroupOnly);
  renderResults();
};

document.getElementById('sortByQty').onclick = () => {
  state.sortBy = 'qty';
  document.getElementById('sortByQty').classList.add('active');
  document.getElementById('sortByName').classList.remove('active');
  renderResults();
};
document.getElementById('sortByName').onclick = () => {
  state.sortBy = 'name';
  document.getElementById('sortByName').classList.add('active');
  document.getElementById('sortByQty').classList.remove('active');
  renderResults();
};

function renderResults(){
  const f = getSelected();
  if(!f) return;
  const info = catInfo();
  const target = targetValue();
  const unitLabel = info.unit === 'g' ? 'g' : 'kcal';

  document.getElementById('rSumFood').textContent = f.name;
  document.getElementById('rSumQty').textContent = `· ${state.qty}g`;
  document.getElementById('rSumProtein').textContent = `= ${target.toFixed(1)}${unitLabel} de ${info.verb} a manter`;
  const originalKcal = (f.kcal / 100) * state.qty;
  document.getElementById('rSumKcal').textContent = `${originalKcal.toFixed(0)} kcal nessa porção`;

  const hasSubgroups = subgroupsInCategory().length > 1 && f.subgroup;
  const toggleRow = document.getElementById('filterToggleRow');
  toggleRow.style.display = hasSubgroups ? 'flex' : 'none';
  document.getElementById('toggleLabel').textContent = `Apenas ${SUBGROUPS[f.subgroup] || 'mesmo subgrupo'}`;

  let candidates = FOODS.filter(x => x.category === f.category && x.id !== f.id);
  if(hasSubgroups && state.sameGroupOnly){
    candidates = candidates.filter(x => x.subgroup === f.subgroup);
  }
  const rTerm = (state.resultsSearchTerm || '').toLowerCase();
  if(rTerm){
    candidates = candidates.filter(x => matchesSearch(x, rTerm));
  }
  candidates = candidates.map(x => {
    const grams = (target / nutrientOf(x)) * 100;
    const kcal = (x.kcal/100) * grams;
    return {...x, grams, kcal};
  });
  if(state.sortBy === 'name'){
    candidates.sort((a,b) => a.name.localeCompare(b.name, 'pt-BR'));
  } else {
    candidates.sort((a,b) => a.grams - b.grams);
  }

  const list = document.getElementById('subList');
  list.innerHTML = '';
  if(candidates.length === 0){
    list.innerHTML = '<div class="empty">Nenhum substituto encontrado.<br>Tenta outra busca ou desative o filtro acima.</div>';
    return;
  }
  candidates.forEach(c => {
    const card = document.createElement('div');
    card.className = 'sub-card';
    card.innerHTML = `
      <div class="left">
        <div class="sname">${c.name}</div>
        <div class="sfacts">${c.kcal.toFixed(0)} kcal</div>
      </div>
      <div class="right">
        <div class="amt">${c.grams.toFixed(0)}</div>
        <div class="u">gramas</div>
      </div>
    `;
    list.appendChild(card);
  });
}

// ---------- INIT ----------
renderCategories();

// --- PWA: service worker + install prompt ---
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstall = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'block';
});

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('installBtn');
  if(btn){
    btn.onclick = async () => {
      if(!deferredInstall) return;
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      deferredInstall = null;
      btn.style.display = 'none';
    };
  }
});
</script>
